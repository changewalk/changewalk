[package]
name = "changewalk"
version = "0.2.0"
edition = "2024"
description = "Walk a GitLab merge request or GitHub pull request in your editor: pick it, read it in order, with notes"

[[bin]]
name = "changewalk"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
