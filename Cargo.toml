[package]
name = "zed-review"
version = "0.2.0"
edition = "2024"
description = "Pick a GitLab merge request you review and open it in Zed in review order"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "5"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
urlencoding = "2"

[profile.release]
strip = true
